[project]
name = "service"
version = "1.0.0"
description = "AI RAG сервис для корпоративных знаний"
readme = "README.md"
authors = [{ name = "alakei", email = "lugachev70@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.14.1",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.1",
    "transformers>=4.47.0",
    "bitsandbytes>=0.46.1",
    "accelerate>=1.1.1",
    "unstructured[pdf]>=0.16.12",
    "pypdf>=5.1.0",
    "PyMuPDF>=1.24.11",
    "python-docx>=1.1.2",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "opencv-python>=4.10.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "redis>=5.2.1",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "miniopy-async>=1.2.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "uvloop>=0.20.0",
    "PyJWT>=2.8.0",
]
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",  # ДОБАВЛЕНО
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=service --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"


filterwarnings = [
    "ignore:.*WordPiece.__init__ will not create from files anymore.*:DeprecationWarning"
]

markers = [
    "integration: Интеграционные тесты, требующие внешних сервисов (Redis, Qdrant)",
    "benchmark: Тесты производительности",
    "slow: Медленные тесты",
    "unit: Быстрые unit-тесты",
]

[tool.coverage.run]
source = ["service"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".git", "__pycache__", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["service*", "tests*"]
exclude = ["data*", "docker*", "scripts*"]